name: "📚 Documentation Improvement"
description: "Suggest improvements, fixes, or additions for Dev AI Sentinel documentation"
title: "[DOCS]: "
labels: ["documentation", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Good documentation makes open-source welcoming. Thank you for helping keep our docs accurate!

  - type: dropdown
    id: doc_file
    attributes:
      label: Target Documentation File
      options:
        - "README.md"
        - "docs/ARCHITECTURE.md"
        - "docs/API.md"
        - "docs/DEVELOPMENT.md"
        - "docs/CONTRIBUTING.md"
        - "docs/SECURITY.md"
        - "docs/ROADMAP.md"
        - "Other / New Document"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current Limitation or Issue
      description: What is currently unclear, out of date, or missing?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Content / Clarification
      description: Detail what changes or additions should be made.
    validations:
      required: true

  - type: checkboxes
    id: pr_ready
    attributes:
      label: Contribution
      options:
        - label: I would like to submit a PR to update this documentation!
